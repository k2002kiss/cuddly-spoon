name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: unzip source
        run: unzip -o cactus-tune-src.zip -d .

      - name: apply latest source
        run: cp CactusTune.cs src/CactusTune.cs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: build
        run: dotnet build src/CactusTune.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: CactusTune
          path: src/bin/Release/net9.0/CactusTune.dll